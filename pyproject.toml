[project]
name = "harness-editor"
version = "0.1.0"
description = "Task-suite runner + self-improvement loop for the self-evolving-harness project (lives outside the editable surface by design)"
requires-python = ">=3.11"
dependencies = ["gemma"]

[tool.uv.sources]
gemma = { path = "../../gemma", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner", "loop"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
